[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osi-sandbox"
version = "0.1.0"
description = "Dockerized OSIRIS feed aggregator with local tiny-LLM analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0,<1",
  "fastapi>=0.115.0,<1",
  "uvicorn[standard]>=0.32.0,<1",
  "pydantic>=2.0,<3",
  "pydantic-settings>=2.0,<3",
  "cryptography>=42.0,<46",
]

[project.optional-dependencies]
s3 = ["boto3>=1.34,<2"]
dev = [
  "pytest>=8.0,<9",
  "ruff>=0.6,<1",
]

[project.scripts]
osi-sandbox-worker = "osi_sandbox.worker:main"
osi-sandbox-api = "osi_sandbox.api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
osi_sandbox = ["../prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]